[pytest]
# Author: Hardik Kansara (202512036) - Cloud/DevOps & QA Engineer
# Keep the suite warning-free in CI. Both filters below are third-party
# deprecations raised inside starlette/anyio by fastapi.testclient, not by
# VerdictAI code, so they are silenced rather than left to mask real warnings.
testpaths = backend/tests
filterwarnings =
    error
    ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning
    ignore:Using `httpx` with `starlette.testclient` is deprecated
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
