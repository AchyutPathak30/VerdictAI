# Local stack: FastAPI gateway + React web console.
# Usage: cp .env.example .env && docker compose up --build
services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"

  web:
    build:
      context: .
      dockerfile: web-app/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5173:80"
    depends_on:
      - api
